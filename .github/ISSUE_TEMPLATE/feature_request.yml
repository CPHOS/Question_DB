name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望实现的功能，我们会认真评估。

  - type: dropdown
    id: component
    attributes:
      label: 相关模块
      description: 功能涉及的模块
      options:
        - 认证 (auth)
        - 题目管理 (questions)
        - 试卷管理 (papers)
        - 运维/导出 (ops)
        - 管理后台 (admin)
        - 数据库/迁移 (migrations)
        - Docker/部署
        - LaTeX 模板 (CPHOS-Latex)
        - API 全局
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题或动机
      description: 描述当前遇到的不便或痛点，说明为什么需要这个功能
      placeholder: "例如: 当前阅卷人无法批量设置难度标签，每次只能逐题操作，效率很低……"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你期望的功能行为，如有具体的 API 设计或交互方式请一并说明
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否考虑过其他解决方式？如果有，请描述
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 建议优先级
      description: 你认为该功能的紧急程度
      options:
        - 低 — 锦上添花
        - 中 — 明显改善体验
        - 高 — 影响核心工作流
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他参考资料、截图、相关 Issue 等
    validations:
      required: false
